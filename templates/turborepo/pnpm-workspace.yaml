packages:
  - "apps/*"
  - "packages/*"
engineStrict: true
savePrefix: ""
allowBuilds:
  "@swc/core": false
  esbuild: true
  unrs-resolver: true
overrides:
  "katex@<0.18.2": ^0.18.2
  "fast-uri@<3.1.9": ^3.1.9
  "dompurify@<3.4.17": ^3.4.17
  "esbuild@<0.27.0": ^0.28.2
  "graphql-scalars@<2.0.1": ^2.0.1
  "happy-dom@<21.0.4": ^21.0.4
  "minimatch@<11.0.1": ^11.0.1
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@next-friday/*"
minimumReleaseAgeExcludePrune: true
peerDependencyRules:
  ignoreMissing:
    - graphql
